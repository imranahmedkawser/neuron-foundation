<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Foundation</title>
<style>
body{font-family:Arial; margin:0; background:#f9f9f9;}
header{background:#c70000; padding:15px 20px; color:white; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
nav a{color:white; margin:0 10px; text-decoration:none;}
nav button{margin-left:5px;}
.btn{background:#c70000; color:white; border:none; padding:10px 20px; cursor:pointer; border-radius:5px; margin-top:10px;}
.container{padding:40px; max-width:1200px; margin:auto; display:flex; gap:40px; flex-wrap:wrap;}
.left{flex:1; min-width:300px;}
.right{background:white; color:#333; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); flex:1; min-width:300px;}
input,select{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;}
#memberPanel, #adminPanel, #donorListPanel{display:none;}
h1 span{color:#c70000;}
.donor-card{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px; background:#fff5f5;}
.pending-card{border-bottom:1px solid #ccc; padding:10px 0;}
</style>
</head>
<body>

<header>
 <b style="font-size:18px;">Neuron Blood Foundation</b>
 <nav>
 <a href="#" onclick="showHome()">Home</a>
 <a href="#" onclick="showDonors()">Donate Blood</a>
 <button class="btn" onclick="showLogin()">Member Login</button>
 <button class="btn" onclick="showAdmin()">Admin</button>
 </nav>
</header>

<div class="container">
 <div class="left">
 <h1><span>Neuron</span> Blood Foundation</h1>
 <p>With youth; on the path of humanity</p>
 </div>

 <div class="right">
 
 <!-- 1. Registration Form -->
 <div id="regForm">
 <h3 style="color:#c70000;">❤️ Blood Donor Registration</h3>
 <input id="name" placeholder="Full Name *" required>
 <input id="phone" placeholder="Phone Number *" required>
 <input id="email" placeholder="Email Address">
 <select id="blood">
 <option>Select blood group</option>
 <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
 <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
 </select>
 <input id="age" placeholder="Age *" type="number">
 <button class="btn" style="width:100%" onclick="register()">Register</button>
 </div>

 <!-- 2. Member Dashboard -->
 <div id="memberPanel">
 <h3>Welcome, <span id="mName"></span></h3>
 <p><b>Phone:</b> <span id="mPhone"></span></p>
 <p><b>Blood:</b> <span id="mBlood"></span></p>
 <h4>My Activities:</h4>
 <ul><li>Status: <span id="mStatus"></span></li></ul>
 <button class="btn" onclick="logout()">Logout</button>
 </div>

 <!-- 3. Admin Panel -->
 <div id="adminPanel">
 <h3>Admin Login</h3>
 <input id="adminPass" placeholder="Admin Password" type="password">
 <button class="btn" onclick="adminLogin()">Login</button>

 <div id="adminContent" style="display:none;">
 <h3>Pending Members:</h3>
 <div id="pendingList">Loading...</div>
 <button class="btn" onclick="logout()">Back</button>
 </div>
 </div>

 <!-- 4. Donor List Panel -->
 <div id="donorListPanel">
 <h3 style="color:#c70000;">🩸 Available Donors</h3>
 <div id="donorList">Loading Donors...</div>
 <button class="btn" onclick="showHome()">Back</button>
 </div>

 </div>
</div>

<script type="module">
// 1. Tomar Firebase Config
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDaiKUjDOcyK_BfpK76LzzXtp0gsRuQ",
 authDomain: "neuron-foundation.firebaseapp.com",
 databaseURL: "https://neuron-foundation-default-rtdb.firebaseio.com",
 projectId: "neuron-foundation",
 storageBucket: "neuron-foundation.appspot.com",
 messagingSenderId: "451445636516",
 appId: "1:451445636516:web:15004e1af05cced638",
 measurementId: "G-RBFSKMQ904"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 2. Register Function
window.register = function(){
 let name = document.getElementById('name').value;
 let phone = document.getElementById('phone').value;
 let email = document.getElementById('email').value;
 let blood = document.getElementById('blood').value;
 let age = document.getElementById('age').value;

 if(!name || !phone || blood=="Select blood group" || !age){alert("Name, Phone, Blood, Age must fill up"); return;}

 push(ref(db, 'members'), {
 name: name, phone: phone, email: email,
 blood: blood, age: age, status: "Pending", date: new Date().toLocaleString()
 });
 alert("Registration Successful! Admin Approval er jonno wait korun");
 document.getElementById('regForm').reset();
}

// 3. Member Login
window.showLogin = async function(){
 let phoneNum = prompt("Login korte Phone Number din:");
 if(!phoneNum) return;
 const dbRef = ref(db);
 const snapshot = await get(child(dbRef, `members`));
 let found = false;
 snapshot.forEach((child) => {
 if(child.val().phone == phoneNum && child.val().status == "Approved"){
 found = true;
 document.getElementById('mName').innerText = child.val().name;
 document.getElementById('mPhone').innerText = child.val().phone;
 document.getElementById('mBlood').innerText = child.val().blood;
 document.getElementById('mStatus').innerText = child.val().status;
 }
 });
 if(found){
 document.getElementById('regForm').style.display = "none";
 document.getElementById('memberPanel').style.display = "block";
 } else { alert("Approval Pending or Wrong Number"); }
}

// 4. Admin Panel
const ADMIN_PASSWORD = "neuron123"; 

window.showAdmin = function(){
 document.getElementById('regForm').style.display = "none";
 document.getElementById('memberPanel').style.display = "none";
 document.getElementById('donorListPanel').style.display = "none";
 document.getElementById('adminPanel').style.display = "block";
 document.getElementById('adminContent').style.display = "none";
}

window.adminLogin = async function(){
 let pass = document.getElementById('adminPass').value;
 if(pass == ADMIN_PASSWORD){
 document.getElementById('adminContent').style.display = "block";
 await loadPending(); // await add korsi
 } else {
 alert("Wrong Password!");
 }
}

// FIXED: get() diye load korbe tai Rules problem thakleo cholbe
async function loadPending(){
 const pendingList = document.getElementById('pendingList');
 pendingList.innerHTML = "Loading...";
 try{
 const snapshot = await get(ref(db, 'members'));
 pendingList.innerHTML = "";
 let hasPending = false;
 snapshot.forEach((childSnap) => {
 if(childSnap.val().status == "Pending"){
 hasPending = true;
 pendingList.innerHTML += `
 <div class="pending-card">
 <b>${childSnap.val().name}</b> - ${childSnap.val().phone} - ${childSnap.val().blood}<br>
 <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="approve('${childSnap.key}')">Approve</button>
 </div>
 `
 }
 })
 if(!hasPending) pendingList.innerHTML = "No Pending Members"
 }catch(e){
 pendingList.innerHTML = "Error: Firebase Rules check koro. Read = true korte hobe";
 }
}

window.approve = async function(id){
 await update(ref(db, 'members/' + id), {status: "Approved"});
 alert("Approved!");
 loadPending(); // Approve korar por abar list refresh
}

// 5. Donor List
window.showDonors = function(){
 document.getElementById('regForm').style.display = "none";
 document.getElementById('memberPanel').style.display = "none";
 document.getElementById('adminPanel').style.display = "none";
 document.getElementById('donorListPanel').style.display = "block";
 loadDonors();
}

async function loadDonors(){
 const donorList = document.getElementById('donorList');
 donorList.innerHTML = "Loading Donors...";
 try{
 const snapshot = await get(ref(db, 'members'));
 donorList.innerHTML = "";
 let hasDonor = false;
 snapshot.forEach((childSnap) => {
 let data = childSnap.val();
 if(data.status == "Approved"){
 hasDonor = true;
 donorList.innerHTML += `
 <div class="donor-card">
 <h4>${data.name} - ${data.blood}</h4>
 <p><b>Age:</b> ${data.age}</p>
 <p><b>Phone:</b> <a href="tel:${data.phone}">${data.phone}</a></p>
 </div>
 `
 }
 })
 if(!hasDonor) donorList.innerHTML = "Ekhono kono Approved Donor nei"
 }catch(e){
 donorList.innerHTML = "Error: Firebase Rules check koro. Read = true korte hobe";
 }
}

window.showHome = function(){
 document.getElementById('regForm').style.display = "block";
 document.getElementById('memberPanel').style.display = "none";
 document.getElementById('adminPanel').style.display = "none";
 document.getElementById('donorListPanel').style.display = "none";
}

window.logout = function(){
 showHome();
}

</script>
</body>
</html>
