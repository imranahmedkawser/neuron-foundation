<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Foundation</title>
<style>
 body{font-family:Arial; margin:0; background:#f9f9f9;}
 header{background:#c70000; padding:15px 20px; color:white; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
 nav a{color:white; margin:0 10px; text-decoration:none;}
 nav button{margin-left:5px;}
 .btn{background:#c70000; color:white; border:none; padding:10px 20px; cursor:pointer; border-radius:5px; margin-top:10px;}
 .btn-green{background:green;}
 .container{padding:40px; max-width:1200px; margin:auto; display:flex; gap:40px; flex-wrap:wrap;}
 .left{flex:1; min-width:300px;}
 .right{background:white; color:#333; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); flex:1; min-width:300px;}
 input,select,textarea{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;}
 label{font-weight:bold; font-size:14px;}
 #memberPanel, #adminPanel, #donorListPane, #donorFormPane{display:none;}
 h1 span{color:#c70000;}
 .donor-card{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px; background:#fff5f5; text-align:left;}
 .pending-card{border-bottom:1px solid #ccc; padding:10px 0;}
</style>
</head>
<body>
<header>
 <b>Neuron Foundation</b>
 <nav>
 <a href="#" onclick="showHome()">Home</a>
 <a href="#" onclick="showDonorForm()">Become a Donor</a>
 <a href="doner.html">Donor List</a>
 <button class="btn" onclick="showLogin()">Member Login</button>
<button class="btn" onclick="showAdmin()">Admin</button>
 </nav>
</header>

<div class="container">
 <div class="left">
 <h1><span>Neuron</span> Blood Foundation</h1>
 <p>With youth; on the path of humanity</p>
 </div>

 <div class="right">
 <!-- 1. Member Registration Form -->
 <div id="regForm">
 <h3 style="color:#c70000;">❤️ Member Registration</h3>
 <input id="name" placeholder="Full Name *" required>
 <input id="phone" placeholder="Phone Number *" required>
 <input id="email" placeholder="Email Address">
 <select id="blood">
 <option>Select blood group</option>
 <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
 <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
 </select>
 <input id="age" placeholder="Age *" type="number">
 <button class="btn" style="width:100%" onclick="register()">Register</button>
 </div>

 <!-- 2. Become a Donor Form - Tumar 10 ta field -->
 <div id="donorFormPanel">
 <h3 style="color:green;">🩸 Become a Blood Donor</h3>
 
 <label>1. *আপনার নাম*</label>
 <input id="dName" placeholder="আপনার নাম" required>
 
 <label>2. *মোবাইল নাম্বার*</label>
 <input id="dPhone" placeholder="01XXXXXXXXX" required>
 
 <label>3. *রক্তের গ্রুপ*</label>
 <select id="dBlood">
 <option>Select</option>
 <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
 <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
 </select>
 
 <label>4. *বয়স*</label>
 <input id="dAge" placeholder="বয়স" type="number" required>
 
 <label>5. *ওজন*</label>
 <input id="dWeight" placeholder="kg এ লিখুন" type="number" required>
 
 <label>6. *সর্বশেষ রক্তদানের তারিখ*</label>
 <input id="dLastDate" type="date">
 
 <label>7. *বিভাগ*</label>
 <select id="dDivision">
 <option>Select</option>
 <option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option>
 <option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option>
 </select>
 
 <label>8. *জেলা*</label>
 <input id="dDistrict" placeholder="জেলা" required>
 
 <label>9. *উপজেলা/থানা*</label>
 <input id="dUpazila" placeholder="উপজেলা/থানা" required>
 
 <label>10. *সম্পূর্ণ ঠিকানা*</label>
 <textarea id="dAddress" placeholder="সম্পূর্ণ ঠিকানা" rows="3"></textarea>

 <button class="btn btn-green" style="width:100%" onclick="registerDonor()">Donor হিসেবে নিবন্ধন করুন</button>
 <button class="btn" onclick="showHome()">Back</button>
 </div>

 <!-- 3. Member Dashboard -->
 <div id="memberPanel">
 <h3>Welcome, <span id="mName"></span></h3>
 <p><b>Phone:</b> <span id="mPhone"></span></p>
 <p><b>Blood:</b> <span id="mBlood"></span></p>
 <h4>My Activities:</h4>
 <ul><li>Status: <span id="mStatus"></span></li></ul>
 <button class="btn" onclick="logout()">Logout</button>
 </div>

<!-- 4. Admin Panel -->
<div id="adminPanel" class="panel" style="display:none;">
 <h3>Admin Login</h3>
 <input id="adminPass" placeholder="Admin Password" type="password">
 <button class="btn" onclick="adminLogin()">Login</button>
 
 <div id="adminContent" style="display:none;">
 <h3>Pending Members:</h3>
 <div id="pendingList">Loading...</div>
 <button class="btn" onclick="logout()">Back</button>
 </div>

 <!-- 5. Donor List Panel -->
 <div id="donorListPanel">
 <h3 style="color:#c70000;">🩸 Donor List </h3>
 <div id="donorList">Loading Donors...</div>
 <button class="btn" onclick="showHome()">Back</button>
 </div>

 </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDaiKUjDOcyK_BfpK76LzzXtp0gsRuQ",
 authDomain: "neuron-foundation.firebaseapp.com",
 databaseURL: "https://neuron-foundation-default-rtdb.firebaseio.com",
 projectId: "neuron-foundation",
 storageBucket: "neuron-foundation.appspot.com",
 messagingSenderId: "451445636516",
 appId: "1:451445636516:web:15004e1af05cced638"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 1. Member Register - Admin Approval lagbe
window.register = function(){
 let name = document.getElementById('name').value;
 let phone = document.getElementById('phone').value;
 let email = document.getElementById('email').value;
 let blood = document.getElementById('blood').value;
 let age = document.getElementById('age').value;
 if(!name || !phone || blood=="Select blood group" || !age){alert("Fill all * fields"); return;}
 push(ref(db, 'members'), {name, phone, email, blood, age, type: "Member", status: "Pending", date: new Date().toLocaleString()});
 alert("Member Registration Successful! Admin Approval er jonno wait korun");
 document.getElementById('regForm').reset();
}

// 2. DIRECT DONOR REGISTER - Auto Approved, 10 ta field
window.registerDonor = function(){
 let name = document.getElementById('dName').value;
 let phone = document.getElementById('dPhone').value;
 let blood = document.getElementById('dBlood').value;
 let age = document.getElementById('dAge').value;
 let weight = document.getElementById('dWeight').value;
 let lastDate = document.getElementById('dLastDate').value;
 let division = document.getElementById('dDivision').value;
 let district = document.getElementById('dDistrict').value;
 let upazila = document.getElementById('dUpazila').value;
 let address = document.getElementById('dAddress').value;

 if(!name || !phone || blood=="Select" || !age || !weight || division=="Select" || !district || !upazila){
 alert(" * চিহ্নিত সব ঘর পূরণ করুন"); 
 return;
 }
 
 push(ref(db, 'donors'), { // Ekhon "donors" alada node e save hobe
 name, phone, blood, age, weight, lastDate, division, district, upazila, address, 
 status: "Approved", 
 date: new Date().toLocaleString()
 });
 alert("Donor Registration Successful! Apni ekhon Donor List 1 e asen");
 document.getElementById('donorFormPanel').reset();
 showDonors(); 
}

// 3. Member Login
window.showLogin = async function(){
 let phoneNum = prompt("Login korte Phone Number din:");
 if(!phoneNum) return;
 const snapshot = await get(ref(db, `members`));
 let found = false;
 snapshot.forEach((childSnap) => {
 let data = childSnap.val();
 if(data.phone == phoneNum && data.type == "Member"){
 found = true;
 document.getElementById('mName').innerText = data.name;
 document.getElementById('mPhone').innerText = data.phone;
 document.getElementById('mBlood').innerText = data.blood;
 document.getElementById('mStatus').innerText = data.status;
 }
 });
 if(found){ hideAll(); document.getElementById('memberPanel').style.display = "block"; } 
 else { alert("Approval Pending or Wrong Number"); }
}

// 4. Admin Panel
const ADMIN_PASSWORD = "neuron123"; 
window.showAdmin = function(){ hideAll(); document.getElementById('adminPanel').style.display = "block"; document.getElementById('adminContent').style.display = "none"; }
window.adminLogin = async function(){
 if(document.getElementById('adminPass').value == ADMIN_PASSWORD){
 document.getElementById('adminContent').style.display = "block"; loadPending(); 
 } else { alert("Wrong Password!"); }
}
async function loadPending(){
 const pendingList = document.getElementById('pendingList');
 pendingList.innerHTML = "Loading...";
 const snapshot = await get(ref(db, 'members'));
 pendingList.innerHTML = ""; let hasPending = false;
 snapshot.forEach((childSnap) => {
 let data = childSnap.val();
 if(data.status == "Pending" && data.type == "Member"){
 hasPending = true;
 pendingList.innerHTML += `<div class="pending-card"><b>${data.name}</b> - ${data.phone}<br><button class="btn" style="padding:5px 10px;" onclick="approve('${childSnap.key}')">Approve</button></div>`
 }
 })
 if(!hasPending) pendingList.innerHTML = "No Pending Members"
}
window.approve = async function(id){
 await update(ref(db, 'members/' + id), {status: "Approved"}); alert("Approved!"); loadPending(); 
}

// 5. Donor List 1 - "donors" node theke load hobe
window.showDonors = function(){ hideAll(); document.getElementById('donorListPanel').style.display = "block"; loadDonors(); }
async function loadDonors(){
 const donorList = document.getElementById('donorList');
 donorList.innerHTML = "Loading Donors...";
 const snapshot = await get(ref(db, 'donors')); // "donors" theke nicche
 donorList.innerHTML = ""; let hasDonor = false;
 snapshot.forEach((childSnap) => {
 let d = childSnap.val();
 hasDonor = true;
 donorList.innerHTML += `
 <div class="donor-card">
 <h4>${d.name} - ${d.blood}</h4>
 <p><b>Phone:</b> <a href="tel:${d.phone}">${d.phone}</a></p>
 <p><b>Age:</b> ${d.age} | <b>Weight:</b> ${d.weight}kg</p>
 <p><b>Last Donate:</b> ${d.lastDate || 'N/A'}</p>
 <p><b>Location:</b> ${d.upazila}, ${d.district}, ${d.division}</p>
 <p><b>Address:</b> ${d.address}</p>
 </div>`
 })
 if(!hasDonor) donorList.innerHTML = "Ekhono kono Donor nei"
}

// 6. Navigation
window.showDonorForm = function(){ hideAll(); document.getElementById('donorFormPanel').style.display = "block"; }
window.showHome = function(){ hideAll(); document.getElementById('regForm').style.display = "block"; }
function hideAll(){
 document.getElementById('regForm').style.display = "none";
 document.getElementById('memberPanel').style.display = "none";
 document.getElementById('adminPanel').style.display = "none";
 document.getElementById('donorListPanel').style.display = "none";
 document.getElementById('donorFormPanel').style.display = "none";
}
window.logout = function(){ showHome(); }
</script>
</body>
</html>
